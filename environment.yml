name: spaceapps
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  # OpenBLAS instead of MKL: MKL's OpenMP runtime clashes with PyTorch's on Windows (OMP Error #15).
  - libblas=*=*openblas
  - pandas
  - matplotlib
  - pyyaml
  - requests
  - jsonschema>=4.18
  - pytest
  - pip
  - pip:
      # CPU build by default. For an NVIDIA GPU (e.g. RTX 4090), replace the line below with the
      # CUDA wheel from https://pytorch.org/get-started/locally/ — the model is tiny, so CPU is enough.
      - torch
